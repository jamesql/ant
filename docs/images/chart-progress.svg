<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 366" width="820" height="366" role="img" aria-label="From nothing to as good as the hand-written rules">
<rect x="0.5" y="0.5" width="819" height="365" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/>
<text x="24" y="34" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">From nothing to as good as the hand-written rules</text>
<text x="24" y="56" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Average over 400 random maps that no brain was trained on. Every ant in the colony uses the same brain.</text>
