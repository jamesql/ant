 font-weight="400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">12</text><line x1="570" x2="570" y1="92" y2="326" stroke="#e1e0d9"/><text x="570" y="344" font-size="12" fill="#898781" text-anchor="middle" font-weight="400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">14</text><text x="360" y="360" font-size="12" fill="#898781" text-anchor="middle" font-weight="400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">food delivered per game (of 14)</text><text x="138" y="115" font-size="13" fill="#0b0b0b" text-anchor="end" font-weight="500" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Random weights</text><text x="158" y="115" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">0.00</text><text x="202" y="115" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">untrained</text><text x="138" y="153" font-size="13" fill="#0b0b0b" text-anchor="end" font-weight="500" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">copycat</text><path d="M150,138 h169.70000000000005 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-169.70000000000005 z" fill="#2a78d6"/><text x="331.70000000000005" y="153" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">5.79</text><text x="375.70000000000005" y="153" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">imitating the instinct</text><text x="138" y="191" font-size="13" fill="#0b0b0b" text-anchor="end" font-weight="500" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">forager v1</text><path d="M150,176 h260.9 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-260.9 z" fill="#2a78d6"/><text x="42