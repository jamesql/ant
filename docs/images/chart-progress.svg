egoe UI', Helvetica, Arial, sans-serif">12.28</text><text x="570.4" y="305" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">hand-written rules</text><line x1="150" x2="150" y1="92" y2="326" stroke="#c3c2b7"/>
